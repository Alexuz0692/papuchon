<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papuchon</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Animated starfield background ── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2.5rem;
      backdrop-filter: blur(18px);
      box-shadow: 0 0 60px rgba(130, 60, 255, 0.25),
                  0 0 120px rgba(255, 80, 180, 0.12);
    }

    /* ── SVG Logo ── */
    #logo-svg {
      width: min(380px, 90vw);
      height: auto;
      display: block;
      margin: 0 auto 2.2rem;
      filter: drop-shadow(0 0 18px rgba(200,100,255,0.7));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ── Tagline ── */
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff6ef7, #a78bfa, #38bdf8, #34d399, #fbbf24, #ff6ef7);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      font-weight: 700;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* ── Subtitle ── */
    .subtitle {
      margin-top: .8rem;
      color: rgba(255,255,255,0.45);
      font-size: .9rem;
      letter-spacing: .1em;
    }

    /* ── Pulsing ring behind logo ── */
    .ring-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 0;
    }
    .ring {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: conic-gradient(from 0deg, #ff6ef7, #a78bfa, #38bdf8, #34d399, #fbbf24, #ff6ef7) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 6s linear infinite;
      opacity: 0;          /* hidden on rectangular logo; enabled via JS */
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Color orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      animation: drift var(--d, 12s) ease-in-out infinite alternate;
      z-index: 1;
    }
    .orb1 { width:420px; height:420px; background:#7c3aed; top:-10%; left:-8%; --d:14s; }
    .orb2 { width:380px; height:380px; background:#ec4899; bottom:-8%; right:-5%; --d:11s; }
    .orb3 { width:300px; height:300px; background:#0ea5e9; bottom:10%; left:20%; --d:16s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.1); }
    }

    /* ── Particle burst on click ── */
    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 999;
      animation: burst 0.9s ease-out forwards;
    }
    @keyframes burst {
      0%   { transform: translate(0,0) scale(1); opacity:1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity:0; }
    }
  </style>
</head>
<body>

  <!-- Background canvas -->
  <canvas id="stars-canvas"></canvas>

  <!-- Colour orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- Main card -->
  <div class="card">
    <div class="ring-wrap">
      <!-- Pure SVG logo — no images -->
      <svg id="logo-svg" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" aria-label="Papuchon logo">
        <defs>
          <!-- Rainbow gradient for text -->
          <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#ff6ef7"/>
            <stop offset="20%"  stop-color="#a78bfa"/>
            <stop offset="40%"  stop-color="#38bdf8"/>
            <stop offset="60%"  stop-color="#34d399"/>
            <stop offset="80%"  stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#ff6ef7"/>
            <animateTransform attributeName="gradientTransform" type="translate"
              from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
          </linearGradient>

          <!-- Glow filter -->
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <!-- Hat gradient -->
          <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>

          <!-- Star gradient -->
          <radialGradient id="starGrad">
            <stop offset="0%"  stop-color="#fde68a"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </radialGradient>
        </defs>

        <!-- ── Decorative stars ── -->
        <g fill="url(#starGrad)" filter="url(#glow)">
          <!-- Star function: 5-point star polygon -->
          <polygon points="30,8 33,18 44,18 35,24 38,34 30,28 22,34 25,24 16,18 27,18" transform="scale(0.6) translate(10,5)" opacity="0.9">
            <animateTransform attributeName="transform" type="rotate" from="0 30 21" to="360 30 21" dur="8s" repeatCount="indefinite" additive="sum"/>
          </polygon>
          <polygon points="370,15 373,25 384,25 375,31 378,41 370,35 362,41 365,31 356,25 367,25" transform="scale(0.5)" opacity="0.85">
            <animateTransform attributeName="transform" type="rotate" from="0 370 28" to="-360 370 28" dur="6s" repeatCount="indefinite" additive="sum"/>
          </polygon>
          <polygon points="200,5 202,11 208,11 203,15 205,21 200,17 195,21 197,15 192,11 198,11" opacity="1">
            <animateTransform attributeName="transform" type="rotate" from="0 200 13" to="360 200 13" dur="5s" repeatCount="indefinite" additive="sum"/>
          </polygon>
        </g>

        <!-- ── Festive hat above letter P ── -->
        <g transform="translate(28, 10)">
          <!-- Hat brim -->
          <ellipse cx="38" cy="62" rx="30" ry="6" fill="url(#hatGrad)" opacity="0.95"/>
          <!-- Hat body -->
          <polygon points="38,8 20,62 56,62" fill="url(#hatGrad)" opacity="0.95"/>
          <!-- Hat band -->
          <rect x="22" y="50" width="32" height="6" rx="2" fill="#fbbf24" opacity="0.9"/>
          <!-- Little star on hat -->
          <polygon points="38,12 39.5,16.5 44,16.5 40.5,19 42,24 38,21.5 34,24 35.5,19 32,16.5 36.5,16.5"
            fill="#fde68a" filter="url(#glow)">
            <animateTransform attributeName="transform" type="rotate" from="0 38 18" to="360 38 18" dur="4s" repeatCount="indefinite" additive="sum"/>
          </polygon>
        </g>

        <!-- ── Main logotype "Papuchon" ── -->
        <text
          x="200" y="175"
          font-family="'Segoe UI', Arial Black, sans-serif"
          font-size="90"
          font-weight="900"
          text-anchor="middle"
          fill="url(#rainbowGrad)"
          filter="url(#glow)"
          letter-spacing="-2"
        >Papuchon</text>

        <!-- ── Underline decorative bar ── -->
        <rect x="40" y="185" width="320" height="5" rx="3" fill="url(#rainbowGrad)" opacity="0.8"/>

        <!-- ── Sparkle dots ── -->
        <g fill="#fff" opacity="0.9">
          <circle cx="40"  cy="190" r="4"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
          <circle cx="200" cy="195" r="5"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
          <circle cx="360" cy="190" r="4"><animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/></circle>
        </g>
      </svg>
    </div>

    <p class="tagline">✨ Estilo &amp; Elegancia ✨</p>
    <p class="subtitle">Haz clic en cualquier parte para más magia</p>
  </div>

  <script>
    /* ══════════════════════════════════════════
       1. Starfield canvas
    ══════════════════════════════════════════ */
    const canvas = document.getElementById('stars-canvas');
    const ctx    = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars(n = 180) {
      stars = Array.from({ length: n }, () => ({
        x:    Math.random() * canvas.width,
        y:    Math.random() * canvas.height,
        r:    Math.random() * 1.6 + 0.3,
        a:    Math.random(),
        da:   (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
        hue:  Math.floor(Math.random() * 360),
      }));
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.a = Math.max(0.05, Math.min(1, s.a + s.da));
        if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 90%, 80%, ${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
    resizeCanvas();
    initStars();
    drawStars();

    /* ══════════════════════════════════════════
       2. Click particle burst
    ══════════════════════════════════════════ */
    const COLORS = ['#ff6ef7','#a78bfa','#38bdf8','#34d399','#fbbf24','#f87171','#fb923c'];

    document.addEventListener('click', e => {
      const count = 20;
      for (let i = 0; i < count; i++) {
        const p   = document.createElement('div');
        p.className = 'particle';
        const angle = (i / count) * 2 * Math.PI;
        const dist  = 60 + Math.random() * 90;
        p.style.cssText = `
          left: ${e.clientX}px;
          top:  ${e.clientY}px;
          width: ${4 + Math.random() * 7}px;
          height: ${4 + Math.random() * 7}px;
          background: ${COLORS[Math.floor(Math.random() * COLORS.length)]};
          --tx: ${Math.cos(angle) * dist}px;
          --ty: ${Math.sin(angle) * dist}px;
          box-shadow: 0 0 6px 2px currentColor;
        `;
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    });

    /* ══════════════════════════════════════════
       3. Dynamic hue shift on card glow
    ══════════════════════════════════════════ */
    let hue = 0;
    const card = document.querySelector('.card');
    (function shiftGlow() {
      hue = (hue + 0.4) % 360;
      card.style.boxShadow = `
        0 0 60px hsla(${hue}, 80%, 65%, 0.3),
        0 0 120px hsla(${(hue + 60) % 360}, 80%, 55%, 0.15)
      `;
      requestAnimationFrame(shiftGlow);
    })();

    /* ══════════════════════════════════════════
       4. Mouse parallax on card
    ══════════════════════════════════════════ */
    document.addEventListener('mousemove', e => {
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      card.style.transform = `perspective(900px) rotateY(${dx * 6}deg) rotateX(${-dy * 5}deg)`;
    });
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(900px) rotateY(0deg) rotateX(0deg)';
    });
  </script>
</body>
</html>
